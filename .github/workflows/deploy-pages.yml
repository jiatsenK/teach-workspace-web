name: Deploy Learning Studio

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/validate-snapshot.mjs'
      - 'scripts/validate-architecture.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-learning-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate public snapshot
        run: node scripts/validate-snapshot.mjs site/data/snapshot.json

      - name: Validate Pages architecture
        run: node scripts/validate-architecture.mjs site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
