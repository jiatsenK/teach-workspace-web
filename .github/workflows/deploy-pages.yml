name: Deploy Learning Studio

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/validate-snapshot.mjs'
      - 'scripts/validate-architecture.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-learning-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_SNAPSHOT_DEPLOYMENT_ID: ${{ secrets.PAGES_SNAPSHOT_DEPLOYMENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh sanitized snapshot from Apps Script
        id: live_snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAGES_SNAPSHOT_DEPLOYMENT_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Live snapshot source is not configured; using committed fallback."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          SNAPSHOT_URL="https://script.google.com/macros/s/${PAGES_SNAPSHOT_DEPLOYMENT_ID}/exec?action=pages-snapshot"
          curl --fail --silent --show-error --location --request POST \
            "$SNAPSHOT_URL" \
            --output site/data/snapshot.json

      - name: Materialize committed sanitized snapshot fallback
        if: steps.live_snapshot.outputs.configured != 'true'
        run: base64 -d site/data/snapshot.json.gz.b64 | gunzip > site/data/snapshot.json

      - name: Validate public snapshot
        run: node scripts/validate-snapshot.mjs site/data/snapshot.json

      - name: Validate Pages architecture
        run: node scripts/validate-architecture.mjs site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
